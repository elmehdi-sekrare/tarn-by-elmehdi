# Cloudflare Workers (static assets only, no Worker script): serves site/ as it is.
# Deploy: the Cloudflare build runs `npx wrangler deploy` (or run it yourself from this folder).
#   /x → /x/ for folders with an index.html, site/404.html (status 404) for anything missing,
#   site/_headers sets the response headers (read by Cloudflare, never served).
name = "tarn-by-elmehdi"
compatibility_date = "2026-11-01"

[assets]
directory = "./site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
