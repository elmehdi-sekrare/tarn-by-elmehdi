# Cloudflare Pages: serves site/ as it is (static Astro build, no build step, no Functions needed).
# Pages handles the routing itself: /x → /x/ for folders with an index.html,
# and site/404.html (with status 404) for anything missing. Headers are in site/_headers.
#
# Deploy: Cloudflare dashboard → Workers & Pages → Create → Pages → connect the Git repo,
#   Framework preset: None · Build command: (empty) · Build output directory: site
# or from this folder: npx wrangler pages deploy   (uses the settings below)
name = "tarn-by-elmehdi"
pages_build_output_dir = "site"
compatibility_date = "2026-11-01"
